#
# Plantilla de correo: ticket.reply.yaml (MiHelpdesk, español de México)
#
# Redactada para MiHelpdesk a partir de la plantilla en inglés de osTicket.
# Reemplaza a la del paquete de idioma oficial.
#
---
notes: |
    Se envía al usuario cuando un agente responde su solicitud.

subject: |
    Re: %{ticket.subject} [#%{ticket.number}]
body: |
    <h3><strong>Hola %{recipient.name.first},</strong></h3>
    %{response}
    <br>
    <br>
    <div style="color: rgb(127, 127, 127);">
    Atentamente,<br>
    El equipo de %{company.name}<br>
    %{signature}
    </div>
    <hr>
    <div style="color: rgb(127, 127, 127); font-size: small; text-align: center;"><em>Esperamos que esta respuesta resuelva sus dudas. Si no es así, no envíe un correo nuevo: responda a este correo o <a href="%{recipient.ticket_link}" style="color: rgb(84, 141, 212);">entre a su cuenta</a> para ver el historial completo de sus solicitudes y respuestas.</em></div>
