#
# Plantilla de correo: ticket.overdue.yaml (MiHelpdesk, español de México)
#
# Redactada para MiHelpdesk a partir de la plantilla en inglés de osTicket.
# Reemplaza a la del paquete de idioma oficial.
#
---
notes: |
    Se envía a los agentes cuando una solicitud se vence, según su fecha de vencimiento o el SLA que tiene asignado.

subject: |
    Solicitud vencida #%{ticket.number}
body: |
    <h3><strong>Hola %{recipient.name},</strong></h3>
    La solicitud <a href="%{ticket.staff_link}">#%{ticket.number}</a> ya está vencida.
    <br>
    <br>
    Por favor revísala lo antes posible para que todas las solicitudes se atiendan a tiempo.
    <br>
    <br>
    Atentamente,<br>
    %{ticket.dept.manager.name}
    <hr>
    <div>Para ver o responder la solicitud, <a href="%{ticket.staff_link}"><span style="color: rgb(84, 141, 212);">inicia sesión</span></a> en el sistema de soporte. Recibes este aviso porque la solicitud está asignada a ti o a un equipo o departamento del que formas parte.</div>
    <em style="color: rgb(127, 127, 127); font-size: small;">Tu sistema de atención a clientes</em>
