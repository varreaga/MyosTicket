#
# Plantilla de correo: task.transfer.alert.yaml (MiHelpdesk, español de México)
#
# Redactada para MiHelpdesk a partir de la plantilla en inglés de osTicket.
# Reemplaza a la del paquete de idioma oficial.
#
---
notes: |
    Se envía a los agentes de un departamento cuando se le transfiere una tarea.

subject: |
    Tarea #%{task.number} transferida a %{task.dept.name}
body: |
    <h3><strong>Hola %{recipient.name},</strong></h3>
    <strong>%{staff.name.short}</strong> transfirió la tarea <a href="%{task.staff_link}">#%{task.number}</a> al departamento %{task.dept.name}.
    <br>
    <br>
    <blockquote>
    %{comments}
    </blockquote>
    <hr>
    <div>Para ver o responder la tarea, <a href="%{task.staff_link}"><span style="color: rgb(84, 141, 212);">inicia sesión</span></a> en el sistema de soporte.</div>
    <em style="color: rgb(127, 127, 127); font-size: small;">Tu sistema de atención a clientes</em>
