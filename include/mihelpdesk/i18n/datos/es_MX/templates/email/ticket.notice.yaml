#
# Plantilla de correo: ticket.notice.yaml (MiHelpdesk, español de México)
#
# Redactada para MiHelpdesk a partir de la plantilla en inglés de osTicket.
# Reemplaza a la del paquete de idioma oficial.
#
---
notes: |
    Se envía al usuario cuando un agente crea una solicitud a su nombre, por ejemplo cuando llama por teléfono.

subject: |
    %{ticket.subject} [#%{ticket.number}]
body: |
    <h3><strong>Hola %{recipient.name.first},</strong></h3>
    Nuestro equipo creó a su nombre la solicitud <a href="%{recipient.ticket_link}">#%{ticket.number}</a> con estos datos:
    <br>
    <br>
    Tema: <strong>%{ticket.topic.name}</strong>
    <br>
    Asunto: <strong>%{ticket.subject}</strong>
    <br>
    <br>
    %{message}
    <br>
    <br>
    %{response}
    <br>
    <br>
    Si hace falta, una persona de nuestro equipo le dará seguimiento lo antes posible. También puede <a href="%{recipient.ticket_link}">consultar el avance en línea</a>.
    <br>
    <br>
    <div style="color: rgb(127, 127, 127);">
    Atentamente,<br>
    El equipo de %{company.name}<br>
    %{signature}
    </div>
    <hr>
    <div style="color: rgb(127, 127, 127); font-size: small;"><em>Si quiere agregar comentarios o información sobre el problema, responda a este correo o <a href="%{recipient.ticket_link}"><span style="color: rgb(84, 141, 212);">entre a su cuenta</span></a> para ver el historial completo de sus solicitudes.</em></div>
