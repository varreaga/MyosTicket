#
# Plantilla de correo: task.overdue.alert.yaml (MiHelpdesk, español de México)
#
# Redactada para MiHelpdesk a partir de la plantilla en inglés de osTicket.
# Reemplaza a la del paquete de idioma oficial.
#
---
notes: |
    Se envía a los agentes cuando una tarea pasa su fecha de vencimiento.

subject: |
    Tarea vencida #%{task.number}
body: |
    <h3><strong>Hola %{recipient.name},</strong></h3>
    La tarea <a href="%{task.staff_link}">#%{task.number}</a> ya pasó su fecha de vencimiento.
    <br>
    <br>
    Por favor revísala lo antes posible para que todas las tareas se atiendan a tiempo.
    <br>
    <br>
    Atentamente,<br>
    %{task.dept.manager.name}
    <hr>
    <div>Para ver o responder la tarea, <a href="%{task.staff_link}"><span style="color: rgb(84, 141, 212);">inicia sesión</span></a> en el sistema de soporte. Recibes este aviso porque la tarea está asignada a ti o a un equipo o departamento del que formas parte.</div>
    <em style="color: rgb(127, 127, 127); font-size: small;">Tu sistema de atención a clientes</em>
