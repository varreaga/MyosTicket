#
# Plantilla de correo: message.alert.yaml (MiHelpdesk, español de México)
#
# Redactada para MiHelpdesk a partir de la plantilla en inglés de osTicket.
# Reemplaza a la del paquete de idioma oficial.
#
---
notes: |
    Se envía a los agentes cuando un usuario agrega un mensaje a una solicitud, ya sea respondiendo un correo o desde el portal.

subject: |
    Nuevo mensaje en la solicitud #%{ticket.number}
body: |
    <h3><strong>Hola %{recipient.name},</strong></h3>
    Hay un mensaje nuevo en la solicitud <a href="%{ticket.staff_link}">#%{ticket.number}</a>.
    <br>
    <br>
    <table>
    <tbody>
    <tr>
        <td><strong>De</strong>:</td>
        <td>%{poster.name} &lt;%{ticket.email}&gt;</td>
    </tr>
    <tr>
        <td><strong>Departamento</strong>:</td>
        <td>%{ticket.dept.name}</td>
    </tr>
    </tbody>
    </table>
    <br>
    %{message}
    <br>
    <br>
    <hr>
    <div>Para ver o responder la solicitud, <a href="%{ticket.staff_link}"><span style="color: rgb(84, 141, 212);">inicia sesión</span></a> en el sistema de soporte.</div>
    <em style="color: rgb(127, 127, 127); font-size: small;">Tu sistema de atención a clientes</em>
