#
# Plantilla de correo: task.assignment.alert.yaml (MiHelpdesk, español de México)
#
# Redactada para MiHelpdesk a partir de la plantilla en inglés de osTicket.
# Reemplaza a la del paquete de idioma oficial.
#
---
notes: |
    Se envía a los agentes cuando se les asigna una tarea a ellos o a su equipo. Use %{assigner} para saber quién la asignó.

subject: |
    Tarea #%{task.number} asignada a ti
body: |
    <h3><strong>Hola %{assignee.name.first},</strong></h3>
    %{assigner.name.short} te asignó la tarea <a href="%{task.staff_link}">#%{task.number}</a>.
    <br>
    <br>
    %{comments}
    <br>
    <br>
    <hr>
    <div>Para ver o responder la tarea, <a href="%{task.staff_link}"><span style="color: rgb(84, 141, 212);">inicia sesión</span></a> en el sistema de soporte.</div>
    <em style="color: rgb(127, 127, 127); font-size: small;">Tu sistema de atención a clientes</em>
