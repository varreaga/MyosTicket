merge_types:
  title: Tipos de Combinación
  content: >
    <b>Combinar Hilos:</b> Hilos de todas las solicitudes se mostrarán cronológicamente.</br> <b>Hilos Separados:</b> Hilos de solicitudes se mostrarán una solicitud a la vez.
child_status:
  title: Estado de la solicitud secundaria
  content: >
    Todas solicitudes Secundarias se establecerán en estado cerrado ya que las entradas del hilo se moverán todas a la solicitud Principal. 
parent_status:
  title: Estado de la solicitud Principal
  content: >
    Si elige establecer un estado primario, la solicitud de nivel superior se cambiará al estado seleccionado. La solicitud en la parte superior de la lista es solicitud Primaria.
reply_types:
  title: Tipos de respuesta
  content: >
    Responder a todos: Esta respuesta se envía al Usuario y a los Colaboradores que elige incluir.</br><b>Respuesta al Usuario:</br> Esta respuesta se envía solo al Usuario, no Colaboradores.</br><b>No enviar respuesta por correo electrónico: No se envían alertas por correo electrónico, sin embargo, la respuesta del Agente es visible para todos los usuarios.
