# Modificado el 2026-11-19 por varreaga (proyecto MiHelpdesk, fork de osTicket): copia del paquete oficial es_MX con "solicitud" en lugar de "ticket". Ver NOTICE.md.
#This is popup help messages for the Admin Panel -> Staff -> Add New Department -> Department Form
#Fields:
#title - Shown in bold at the top of the popover window
#content - The body of the help popover
#links - List of links shows below the content
#title - Link title
#href - href of link (links starting with / are translated to the
#helpdesk installation path)
#The key names such as 'helpdesk_name' should not be translated as they
#must match the HTML #ids put into the page template.
---
status:
  title: Estado
  content: >
    Si está deshabilitado o archivado, este <span class="doc-desc-title"> Departmento </span> no estará disponible.
type:
  title: Tipo
  content: >
    Selecciona <span class="doc-desc-opt">privado</span> si desea que se asignen máscaras a este departamento en el portal del cliente. Además, cuando se etiquete como <span class="doc-desc-opt">privado</span>,la<span class="doc-desc-title">firma de departamento</span>no será mostrado en las respuestas de Email.<br/><br/>Por lo menos un departamento debe ser <span class="doc-desc-opt">público</span>
email:
  title: Correo electrónico
  content: >
    Correo electrónico que se usa para mandar las respuestas de los agentes a las solicitudes del usuario.
template:
  title: Conjunto de plantillas
  content: >
    Plantilla de Correo  <span class="doc-desc-title">Activada</span> utilizada para Auto-Respuestas de Alertas y Avisos para solicitudes regresadas a este departamento.
  links:
    - 
      title: Administrar plantillas
      href: /scp/templates.php
sla:
  title: SLA
  content: >
    SLA para solicitudes enviadas a este departamento.
  links:
    - 
      title: Gestionar planes de SLA
      href: /scp/slas.php
schedule:
  title: Programar
  content: >
    Horario utilizado por el SLA al momento de procesar solicitudes atrasadas dirigidas a este Departamento. <br><br> Este configuración toma preferencia sobre las configuraciones del Sistema y SLA.
  links:
    - 
      title: Administrar Programaciones
      href: /scp/schedules.php
manager:
  title: Gerente del Departamento
  content: >
    Seleccione un <span class="doc-desc-title"> Gerente</span> para este departamento. <br/> <br/> Los gerentes pueden configurarse para recibir alertas especiales y también tienen el derecho de cancelar la asignación de solicitudes.
  links:
    - 
      title: Administrar alertas y avisos
      href: /scp/settings.php?t=alerts
group_membership:
  title: Destinatarios de Alertas y Noticias
  content: >
    Seleccione a los destinatarios de las <span class="doc-desc-title"> alertas y avisos</span>configurados.
  links:
    - 
      title: Configurar alertas y avisos
      href: "/scp/settings.php?t=tickets#alerts"
sandboxing:
  title: Restricciones de Asignación de solicitudes
  content: >
    Determine si las solicitudes pueden asignarse a todos los agentes, a los agentes con acceso al Departamento principal o ampliado, o solo a los agentes con acceso al Departamento primario.
disable_auto_claim:
  title: Desactivada Auto Demanda
  content: >
    Marca aquí para <strong>desactivar</strong> la Auto Demanda en respuestas para este departamento. <br><br> Los agentes aún pueden demandar manualmente solicitudes no asignadas
disable_reopen_auto_assign:
  title: Desactivar Asignación Automática al Reabrir
  content: >
    Active para <strong>desactivar</strong> la asignación automática de las solicitudes reabiertas para este departamento. <br><br> De lo contrario, la solicitud se asignará automáticamente al último agente que respondió
auto_response_settings:
  title: Configuración de autoresponder
  content: >
    Esto le permite anular la configuración global de Autoresponder para este departamento.
new_ticket:
  title: Nueva solicitud de auto-respuesta 
  content: >
    Puede desactivar la respuesta automática enviada al usuario cuando una solicitud nueva es creada y enrutada a este departamento.
new_message:
  title: Nuevo mensaje de respuesta automática
  content: >
    Puede desactivar la respuesta automática enviada al usuario para confirmar un nuevo mensaje publicado por solicitudes en este Departamento.
auto_response_email:
  title: Correo electrónico de respuesta automática
  content: >
    Seleccione una dirección de correo electrónico desde donde se envían Auto-respuestas para este departamento.
department_access:
  title: Acceso de grupo
  content: >
    Permitir que agentes de otro de departamentos accedan a las solicitudes de este Departamento.
department_signature:
  title: Firma del departamento
  content: >
    La Firma se pone a disposición, como una opción para departamentos <span class="doc-desc-opt"> Públicos</span>, en las respuestas de Agente.
