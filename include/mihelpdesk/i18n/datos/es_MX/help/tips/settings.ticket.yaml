# Modificado el 2026-11-19 por varreaga (proyecto MiHelpdesk, fork de osTicket): copia del paquete oficial es_MX con "solicitud" en lugar de "ticket". Ver NOTICE.md.
#This is popup help messages for the Admin Panel -> Settings -> Tickets
#Fields:
#title - Shown in bold at the top of the popover window
#content - The body of the help popover
#links - List of links shows below the content
#title - Link title
#href - href of link (links starting with / are translated to the
#helpdesk installation path)
#The key names such as 'helpdesk_name' should not be translated as they
#must match the HTML #ids put into the page template.
---
number_format:
  title: Formato del Número de solicitud
  content: >
    Esta característica es utilizada para generar números de solicitudes. Utilice signos de hash (`#`) donde los numerous van a ir. Cualquier otro texto permanecerá en el format de la solicitud. <span class="doc-desc-title">Temas de ayuda</span> pueden definir formatos personalizados. <br/><br/> Por ejemplo, para numeros de sies dígitos, utilice <code>######</code>.
sequence_id:
  title: Secuencia de Números de solicitud
  content: >
    Elija una secuencia desde la cual derivar nuevos números de solicitud. El sistema tiene una secuencia incremental y una secuencia aleatoria de forma predeterminada. Puede crear tantas secuencias como desee. Utilice varias secuencias en la configuración del <span class="doc-desc-title"> Formato de número de solicitud</span> para temas de ayuda.
queue_bucket_counts:
  title: Recuento de solicitudes de nivel superior
  content: >
    Esta configuración se usa para ocultar o mostrar los recuentos de solicitudes en las colas de nivel principal. Regresa a la forma en que solían ser las cosas.
default_ticket_status:
  title: Estado predeterminado para nuevas entradas
  content: >
    Elija un estado como el valor predeterminado para nuevas entradas. Esto puede ser definido para cada tema de ayuda, si así lo desea. También puede ser anulado por un filtro de entrada.
  links:
    - 
      title: Gestionar Estados de solicitud
      href: /scp/lists.php?type=ticket-status
default_sla:
  title: SLA por defecto
  content: >
    Elija el valor por defecto de acuerdo de nivel de servicio para gestionar cuanto tiempo una solicitud puede permanecer abierta antes de que caduque.
  links:
    - 
      title: Crear más planes SLA
      href: /scp/slas.php
default_ticket_queue:
  title: Cola de solicitud por defecto
  content: >
    Configuración para determinar la cola predeterminada para los Agentes al iniciar sesión. Los agentes también pueden configurar su cola predeterminada en su pestaña Perfil para sobrescribir esta configuración.
default_priority:
  title: Prioridad predeterminada
  content: >
    Elija<span class="doc-desc-title"> prioridad</span>por defecto para solicitudes sin una prioridad automática. <br/> <br/> La prioridad puede asignarse mediante el tema de ayuda, Departamento de enrutado o configuración del filtro de solicitud.
maximum_open_tickets:
  title: Máximo número de solicitudes abiertas
  content: >
    Introduzca el máximo <em>número</em> de solicitudes que un usuario puede tener <strong>abiertas</strong> en su sistema de ayuda. <br><br>Enter <span class="doc-desc-opt"> 0</span> si desea desactivar esta limitación.
email_ticket_priority:
  title: Prioridad del Email de la solicitud
  content: >
    Prioridad de uso correo electrónico asignado por el servicio de correo del destinatario
show_related_tickets:
  title: Mostrar solicitudes relacionadas
  content: >
    Mostrar todas las solicitudes relacionadas en el Inicio de sesión de un usuario - de todas formas el acceso está restringida para una solicitud por acceso
human_verification:
  title: Verificación humana
  content: >
    Activar CAPTCHA en el Portal del cliente para verificar que una solicitud entrante es  resultada de  actividad humana. <br><br>Requiere librería GDLib
claim_tickets:
  title: Reclamar solicitudes en respuesta
  content: >
    Habilite esta opción para asignar las solicitudes no asignadas al agente que responde. <br><br> Las solicitudes reabiertas siempre se asignan al último agente que ha respondido a menos que la asignación automática al reabrir esté deshabilitada a nivel de Departamento.
auto_refer:
  title: Auto-referir solicitudes al Cerrar
  content: >
    Habilite esta opción para referir automáticamente las solicitudes al Agente asignado o de cierre cuando se cierre una solicitud. <br><br> Esto es necesario cuando desea brindarles a los agentes con acceso limitado, acceso continuo a las solicitudes asignadas después de que estén cerradas. 
collaborator_ticket_visibility:
  title: Visibilidad de colaboradores de solicitudes
  content: >
    Si está habilitado, los usuarios tendrán visibilidad de TODAS las solicitudes en las que participen al iniciar sesión en el portal web. <br><br> Si está desactivado, los usuarios solo podrán ver sus propias entradas al iniciar sesión en el portal web.
require_topic_to_close:
  title: Es necesario seleccionar un tema de ayuda para cerrar.
  content: >
    Si está habilitado, una solicitud debe tener un tema de ayuda para ser cerrada por un agente
allow_external_images:
  title: Permitir imágenes externas
  content: >
    Si está habilitado, el sistema permitirá imágenes en línea externas que tengan una extensión de imagen válida (.png, .jpg, .jpeg, .gif). Si está deshabilitado, el sistema excluirá las imágenes en línea externas. Una advertencia a tener en cuenta es que si la configuración está Desactivada, todavía almacenaremos imágenes externas en línea que tengan una extensión de imagen válida en caso de que la configuración se vuelva a habilitar en el futuro. 
assigned_tickets:
  title: Solicitudes asignadas
  content: >
    Activar esta característica para excluir las solicitudes asignadas de la <span class="doc-desc-title"> Cola de entradas abiertas</span>.
answered_tickets:
  title: Solicitudes contestadas
  content: >
    Activar esta opción para mostrar las solicitudes contestadas en la <span class="doc-desc-title"> Cola de entradas respondió</span>. De lo contrario, se incluirá en la <span class="doc-desc-title"> Cola de solicitudes abiertas</span>.
ticket_attachment_settings:
  title: Adjuntos a la solicitud
  content: >
    Configurar las opciones para los archivos adjuntos en el campo <span class="doc-desc-title"> asunto detalles</span>. Estos valores se utilizan para todas las nuevas entradas y nuevos mensajes sin importar el canal de la fuente (portal web, correo electrónico, api, etc.).
