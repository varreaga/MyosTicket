# Modificado el 2026-11-19 por varreaga (proyecto MiHelpdesk, fork de osTicket): copia del paquete oficial es_MX con "solicitud" en lugar de "ticket". Ver NOTICE.md.
#This is popup help messages for the Admin Panel -> Manage -> SLA Plan
#Fields:
#title - Shown in bold at the top of the popover window
#content - The body of the help popover
#links - List of links shows below the content
#title - Link title
#href - href of link (links starting with / are translated to the
#helpdesk installation path)
#The key names such as 'helpdesk_name' should not be translated as they
#must match the HTML #ids put into the page template.
---
name:
  title: Nombre
  content: >
    Elija un nombre descriptivo para este <span class="doc-desc-title">Plan SLA</span>  de forma que refleje su propósito.
grace_period:
  title: Período de gracia
  content: >
    Determine la cantidad de horas después de la creación de una solicitud que se marcará automáticamente como vencida. <br><br> Las horas se cuentan durante el horario especificado. La jerarquía es programación de Departamento, programación de SLA y luego programación predeterminada del sistema. Si no se configura ninguna programación, las horas se cuentan 24/7 (incluso después del horario laboral) hasta que la solicitud esté vencida. 
transient:
  title: Transitorio
  content: >
    Los SLAs Transitorios son considerados temporales y pueden ser reemplazados por un SLA no transitorio ante una transferencia de <span class="doc-desc-opt">Departamento</span> o cuando su <span class="doc-desc-title">Tema de Ayuda</span> es modificado.
schedule:
  title: Programar
  content: >
    Elija la Programación que utilizará este SLA cuando presente solicitudes Atrasadas. <br> <br> Tenga en cuenta que la configuración del Departamento puede anular esta programación.
  links:
    - 
      title: Administrar Programaciones
      href: /scp/schedules.php
